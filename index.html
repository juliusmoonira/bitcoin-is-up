<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin is up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
:root { --ink: #0a0a0a; --grey: #5b5f66; --sand: #f4f4f4; --gutter: 16px;
  --display: "Inter Tight", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font: 400 18px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
.section { padding-top: 88px; padding-bottom: 88px; }
.section h2 { margin: 0; font: 600 clamp(32px, 4.2vw, 52px)/1.05 var(--display); letter-spacing: -0.02em; max-width: 15em; }
.btc-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-top: 28px; }
.btc-price { font: 500 clamp(40px, 6vw, 64px)/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.btc-chg { font: 500 18px/1 var(--body); color: #0f8a4b; }
.btc-box { margin-top: 20px; background: var(--sand); border-radius: 8px; padding: 20px 16px; perspective: 900px; }
.btc-flip { transition: transform 1.1s cubic-bezier(.6,0,.2,1); transform-origin: 50% 50%; }
.btc-flip.is-flipped { transform: rotateX(180deg); }
.btc-flip svg { display: block; width: 100%; height: auto; overflow: visible; }
.btc-line { fill: none; stroke: #d12f2f; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; transition: stroke .5s linear 1.1s; }
.btc-line.is-up { stroke: #0f8a4b; }
.btc-axis { display: flex; justify-content: space-between; font-size: 14px; color: var(--grey); margin-top: 8px; }
.btc-note { margin-top: 14px; font-size: 16px; color: var(--grey); min-height: 1.5em; }
@media (min-width: 900px) { .btc-box { padding: 32px 36px; } }
.sponsors { padding-top: 0; }
.sponsors-lead { margin: 16px 0 0; color: var(--grey); }
.sponsor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 28px; }
.sponsor { display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 2; padding: 20px; background: var(--sand); border-radius: 8px; color: var(--grey); font-size: 14px; }
.sponsor img { display: block; width: 100%; max-width: 160px; height: auto; }
.sponsor-open { border: 1.5px dashed #c9cbd0; }
a.sponsor:focus-visible, .sponsor-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sponsor-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 28px; padding: 0 24px; background: var(--ink); color: #fff; border-radius: 8px; font: 500 16px/1 var(--body); text-decoration: none; }
@media (min-width: 900px) { .sponsor-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
</style>
</head>
<body>
  <section class="section wrap" id="btc" aria-labelledby="btc-h">
    <h2 id="btc-h">Bitcoin is up this week</h2>
    <div class="btc-top"><span class="btc-price" id="btc-price">$--</span><span class="btc-chg" id="btc-chg"></span></div>
    <div class="btc-box">
      <div class="btc-flip" id="btc-flip">
        <svg viewBox="0 0 600 240" role="img" aria-label="Bitcoin price, last 7 days"><path class="btc-line" id="btc-line" d=""/></svg>
        <div class="btc-axis"><span>7 days ago</span><span>Now</span></div>
      </div>
    </div>
    <p class="btc-note" id="btc-note" aria-live="polite"></p>
  </section>

  <section class="section wrap sponsors" id="sponsors" aria-labelledby="sponsors-h">
    <h2 id="sponsors-h">Sponsors</h2>
    <p class="sponsors-lead">Bitcoin is up is made possible by:</p>
    <div class="sponsor-grid">
      <a class="sponsor" href="https://moonira.com" rel="noopener"><img src="moonira-logo.svg" alt="Moonira"></a>
      <div class="sponsor sponsor-open">Your logo</div>
      <div class="sponsor sponsor-open">Your logo</div>
      <div class="sponsor sponsor-open">Your logo</div>
    </div>
    <a class="sponsor-btn" href="mailto:julius0foerster@gmail.com?subject=Sponsor%20Bitcoin%20is%20up">Become a sponsor</a>
  </section>

<script>
/* Bitcoin joke chart: last 7 days, hourly. Flips itself upside down when the week is red. */
(function () {
  var sec = document.getElementById('btc'); if (!sec) return;
  var line = document.getElementById('btc-line'), flip = document.getElementById('btc-flip'), note = document.getElementById('btc-note');
  var W = 600, H = 240, started = false;
  function coingecko() {
    return fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=7')
      .then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { return d.prices.map(function (p) { return p[1]; }); });
  }
  function coinbase() {
    return fetch('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600')
      .then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { return d.slice(0, 168).reverse().map(function (c) { return c[4]; }); });
  }
  function show(p) {
    if (!p || p.length < 2) throw 0;
    var min = Math.min.apply(null, p), max = Math.max.apply(null, p), span = max - min || 1;
    line.setAttribute('d', p.map(function (v, i) { return (i ? 'L' : 'M') + (i / (p.length - 1) * W).toFixed(1) + ' ' + (8 + (1 - (v - min) / span) * (H - 16)).toFixed(1); }).join(' '));
    var first = p[0], last = p[p.length - 1], pct = Math.abs((last - first) / first * 100).toFixed(1), down = last < first;
    document.getElementById('btc-price').textContent = '$' + Math.round(last).toLocaleString('en-US');
    document.getElementById('btc-chg').textContent = '+' + pct + '% this week';
    var len = line.getTotalLength();
    line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
    line.getBoundingClientRect();
    line.style.transition = 'stroke-dashoffset 1.6s ease-out, stroke .5s linear 1.1s';
    line.style.strokeDashoffset = 0;
    if (!down) { line.classList.add('is-up'); line.style.transition = 'stroke-dashoffset 1.6s ease-out'; return; }
    setTimeout(function () {
      flip.classList.add('is-flipped'); line.classList.add('is-up');
      note.textContent = 'It was down ' + pct + '%. We turned the chart upside down.';
    }, 2100);
  }
  function start() {
    if (started) return; started = true;
    coingecko().catch(coinbase).then(show).catch(function () { note.textContent = 'The price feed did not load. Refresh to try again.'; });
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e, o) { if (e[0].isIntersecting) { o.disconnect(); start(); } }, { threshold: 0.35 }).observe(sec);
  } else start();
})();
</script>
</body>
</html>
